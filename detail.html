  <script>
    (function () {
      if (window.matchMedia("(hover: none) and (pointer: coarse)").matches) {
        var viewport = document.querySelector('meta[name="viewport"]');
        if (viewport) viewport.setAttribute("content", "width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no");
        ["gesturestart", "gesturechange", "gestureend"].forEach(function (type) {
          document.addEventListener(type, function (event) { event.preventDefault(); }, { passive: false });
        });
        document.addEventListener("touchmove", function (event) {
          if (event.touches && event.touches.length > 1 && event.cancelable) event.preventDefault();
        }, { passive: false });
      }
      if (/\/bot_dash$/i.test(location.pathname)) {
        location.replace(location.pathname + "/" + location.search + location.hash);
        return;
      }
      try {
        if (history.scrollRestoration) history.scrollRestoration = "manual";
        var nav = performance.getEntriesByType("navigation");
        if (nav[0] && nav[0].type === "reload") {
          sessionStorage.removeItem("botdash_scroll");
          scrollTo(0, 0);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous">
