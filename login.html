<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="bingbot" content="noindex, nofollow, noarchive">
  <meta name="Yeti" content="noindex, nofollow, noarchive">
  <meta name="Daumoa" content="noindex, nofollow">
  <meta name="theme-color" content="#07070f">
  <title>로그인 · 봇대시</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%235266eb'/%3E%3C/svg%3E">
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem("botdash_theme");
        var theme = savedTheme === "glass" ? "glass" : "classic";
        document.documentElement.setAttribute("data-theme", theme);
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute("content", theme === "glass" ? "#e6dfd4" : "#07070f");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "classic");
      }
      if (window.matchMedia("(hover: none) and (pointer: coarse)").matches) {
        var viewport = document.querySelector('meta[name="viewport"]');
        if (viewport) viewport.setAttribute("content", "width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no");
        ["gesturestart", "gesturechange", "gestureend"].forEach(function (type) {
          document.addEventListener(type, function (event) { event.preventDefault(); }, { passive: false });
        });
        document.addEventListener("touchmove", function (event) {
          if (event.touches && event.touches.length > 1 && event.cancelable) event.preventDefault();
        }, { passive: false });
      }
      if (/\/bot_dash$/i.test(location.pathname)) {
        location.replace(location.pathname + "/" + location.search + location.hash);
        return;
      }
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css?v=32">
  <link rel="stylesheet" href="css/theme-glass.css?v=6">
</head>
<body data-page="login">
  <div class="login-shell">
    <section class="login-hero">
      <div>
        <p class="eyebrow">BOT DASH</p>
        <h1>여러 캐릭터의 오늘을 한 화면에서.</h1>
      </div>
      <p>블로그 방문자, 글 수, 계정, 루틴을 카드로 모아 보는 내부용 대시보드입니다.</p>
    </section>
    <section class="login-panel">
      <div class="login-card">
        <div class="login-card-top">
          <h2>로그인</h2>
          <div class="theme-switch" role="group" aria-label="화면 테마">
            <button type="button" data-theme-choice="classic" aria-pressed="true">기본</button>
            <button type="button" data-theme-choice="glass" aria-pressed="false">글래시</button>
          </div>
        </div>
        <p>내부에서 쓰는 아이디와 비밀번호를 입력하세요.</p>
        <form id="loginForm" class="login-form" autocomplete="on">
          <p id="loginAlert" class="alert" role="alert" hidden></p>
          <label class="field">
            <span>아이디</span>
            <input id="username" name="username" type="text" autocomplete="username" spellcheck="false" required>
          </label>
          <label class="field">
            <span>비밀번호</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <label class="remember">
            <input id="rememberUser" type="checkbox">
            <span>아이디 저장</span>
          </label>
          <button type="submit" class="submit" id="loginSubmit">로그인</button>
        </form>
      </div>
    </section>
  </div>
  <noscript>
    <style>body[data-page="login"] .login-shell { visibility: visible !important; }</style>
    <p class="notice wrap">이 대시보드는 JavaScript가 필요합니다.</p>
  </noscript>
  <script src="js/config.js"></script>
  <script src="js/reel.js"></script>
  <script src="js/chart.js?v=23"></script>
  <script src="js/login.js?v=2"></script>
  <script src="js/app.js?v=33"></script>
</body>
</html>
